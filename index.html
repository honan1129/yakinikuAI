<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>豊南焼肉 AIソムリエ</title>
<style>
  :root {
    --bg:#1A1A18; --panel:#2C2C2A; --border:#3D3D3A;
    --gold:#D4A96A; --ember:#C0392B; --ember-deep:#922B21; --cream:#F5EFE0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:var(--bg); color:var(--cream);
    font-family:'Hiragino Sans','Yu Gothic',sans-serif;
    height:100vh; height:100dvh; display:flex; flex-direction:column;
  }
  header {
    background:var(--panel); border-bottom:1px solid var(--border);
    padding:13px 18px; display:flex; align-items:center; gap:10px;
  }
  .h-title { font-weight:700; font-size:16px; color:var(--gold); letter-spacing:0.06em; }
  .h-sub { font-size:11px; color:#888; }
  .dot { margin-left:auto; width:8px; height:8px; border-radius:50%; background:#4CAF50; box-shadow:0 0 6px #4CAF50; }

  #setup {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; gap:16px; text-align:center;
  }
  #setup h2 { color:var(--gold); font-size:18px; }
  #setup p { font-size:13px; color:#aaa; line-height:1.8; max-width:400px; }
  #setup a { color:var(--gold); }
  #api-key-input {
    width:100%; max-width:400px; background:var(--border); border:1px solid #4a4a47;
    color:var(--cream); padding:12px 16px; border-radius:10px; font-size:13px; outline:none;
  }
  #start-btn {
    background:var(--ember); color:#fff; border:none; padding:12px 32px;
    border-radius:24px; font-size:15px; cursor:pointer; font-family:inherit;
  }

  #chat { flex:1; overflow-y:auto; padding:16px 12px; display:none; flex-direction:column; gap:12px; }
  .msg { display:flex; gap:8px; align-items:flex-end; }
  .msg.user { flex-direction:row-reverse; }
  .avatar {
    width:32px; height:32px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:15px;
    background:var(--border);
  }
  .msg.ai .avatar { background:var(--ember-deep); }
  .bubble {
    max-width:76%; padding:11px 14px; line-height:1.75; font-size:14px;
    white-space:pre-wrap; border-radius:16px;
  }
  .msg.ai .bubble { background:var(--panel); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .msg.user .bubble { background:var(--ember); color:#fff; border-bottom-right-radius:4px; }

  .typing { background:var(--panel); border:1px solid var(--border); border-radius:16px; border-bottom-left-radius:4px; padding:12px 16px; display:flex; gap:5px; }
  .tdot { width:7px; height:7px; border-radius:50%; background:var(--gold); animation:b 1.2s infinite; }
  .tdot:nth-child(2){ animation-delay:.2s } .tdot:nth-child(3){ animation-delay:.4s }
  @keyframes b { 0%,80%,100%{transform:translateY(0);opacity:.5} 40%{transform:translateY(-6px);opacity:1} }

  #quick { display:flex; flex-wrap:wrap; gap:7px; padding:0 12px 8px 52px; }
  .qbtn {
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    padding:6px 13px; border-radius:20px; font-size:13px; cursor:pointer; font-family:inherit;
  }

  #input-bar {
    background:var(--panel); border-top:1px solid var(--border);
    padding:11px 14px; display:none; gap:9px;
  }
  #txt {
    flex:1; background:var(--border); border:1px solid #4a4a47; color:var(--cream);
    padding:10px 15px; border-radius:22px; font-size:14px; outline:none; font-family:inherit;
  }
  #snd {
    width:42px; height:42px; background:var(--ember); border:none; border-radius:50%;
    cursor:pointer; font-size:17px; color:#fff; flex-shrink:0;
  }
  #snd:disabled { background:var(--border); cursor:not-allowed; }
</style>
</head>
<body>

<header>
  <span style="font-size:24px">🔥</span>
  <div>
    <div class="h-title">豊南焼肉 AIソムリエ</div>
    <div class="h-sub">あなたにぴったりのメニューをご提案します</div>
  </div>
  <div class="dot"></div>
</header>

<div id="setup">
  <h2>🔑 初回セットアップ</h2>
  <p>
    Anthropic APIキーを入力してください。<br>
    キーは console.anthropic.com で発行できます。<br><br>
    ※キーはこの端末のブラウザ内にのみ保存されます。
  </p>
  <input type="password" id="api-key-input" placeholder="sk-ant-api03-..." />
  <button id="start-btn">はじめる 🔥</button>
</div>

<div id="chat"></div>
<div id="quick"></div>

<div id="input-bar">
  <input type="text" id="txt" placeholder="メッセージを入力…" />
  <button id="snd">↑</button>
</div>

<script>
const SYSTEM_PROMPT = `あなたは愛知県豊田市の老舗焼肉店「豊南焼肉（ほうなんやきにく）」のAIソムリエです。必ず日本語で答えてください。
お客様の好みをヒアリングして最適なメニューをご提案します。

【お店の特徴】
- 創業30年以上、地元で愛される老舗
- 厳選した「三河牛」「鳳来牛」を使用（飛騨牛取扱店）
- お肉はウェットエイジングで熟成
- 豚は愛知県産の厳選豚、ホルモンは豊田の加工場から直入荷の豚ホルモンと近江牛ホルモン
- 白米は地元のお米「大地の風」を使用
- スープは牛骨と野菜の出汁ベース
- 10〜80名対応の宴会場、個室・半個室、駐車場50台

【単品メニュー（全て税込）】
■牛タン: 柔らか上タン1,760円 / ネギ上タン1,920円 / タン1,280円 / ネギタン1,430円(人気) / 切り落としタン660円(数量限定) / 分厚い特上タン2,750円(数量限定)
■和牛カルビ: カルビ990円 / 上カルビ1,650円 / 特にうまいカルビ2,750円〜(希少)
■牛ハラミ: 極上和牛ハラミ3,058円(品薄&人気) / ハラミ1,540円
■牛赤身: 本日の和牛赤身(時価・入荷不定) / ソフト赤身1,100円 / 柔らか上赤身ちょっと厚切り1,650円 ※ミディアムレアが最高、焼きすぎ注意
■牛ロース: ロース1,100円 / 上ロースシン1,650円 / サーロイン厚切り2,980円
■つぼ漬け(タレ好きに): つぼ漬けカルビ1,980円(約2人前) / 特上つぼ漬けスペシャル3,980円(約2人前)
■豚肉(愛知県産): 豚ロース750円 / ネギ豚ロース880円 / 豚しそ880円 / 豚バラカルビ750円
■鶏肉: せせり680円 / 鶏もも600円
■ホルモン(数量限定): 豚ホルモン440円(小腸と大腸ミックス) / 近江牛ホルモン770円(ジューシーな小腸) / 近江牛テッチャン880円(脂身控えめ大腸) / 近江牛レバー680円(要加熱) / 近江牛ハツ770円(要加熱) / 上ミノ770円
■ウィンナー: ポークウィンナー490円 / 辛口ウィンナー520円
■海鮮: 有頭えび(2尾)780円 / イカ660円 / 平貝(3枚)710円 / 海幸盛1,900円
■サラダ・野菜: おまかせ豊南サラダ1,080円 / シーザーサラダ680円 / ピリ辛チョレギサラダ680円 / サンチュ480円 / 焼き野菜盛580円 / 焼き野菜単品300円
■キムチ・ナムル: 白菜キムチ460円 / 大根キムチ450円 / キムチ2種盛り810円 / チャンジャ520円 / ナムル盛550円
■一品: センマイ刺し(ボイル)890円 / 馬刺し1,130円 / さくらユッケ(馬肉)850円 / 豊南のどて煮500円 / 丸ごと焼きニンニク600円 / 韓国のり220円 / フライドポテト580円
■スープ: わかめスープ460円 / 玉子スープ530円 / ユッケジャンスープ990円(辛口) / 味噌汁220円
■ごはんもの: ライス大380円・中330円・小280円 / ネギ飯610円 / TKG470円 / 石焼ビビンバ1,130円 / ビビンバ930円 / クッパ600円 / ユッケジャンクッパ990円 / チャンジャクッパ790円 / お茶漬け490円 / おにぎり2個420円 / ラーメン990円
■デザート: アイスクリーム420円(バニラ・抹茶・ストロベリー) / さつま姫600円 / 自家製なめらか杏仁豆腐550円 / 豊南プリン390円 / フォンダンショコラ790円
■薬味: 味付けネギ220円 / わさび100円 / コチュジャン100円 / 足助の合わせ岩塩100円 / ポン酢100円 / カットレモン50円

【予約限定コース(税込・お一人様・2名以上・前営業日まで)】
■並お手頃コース4,400円 / 上豊南王道コース6,050円 / 特上贅沢三昧コース7,700円 / 極上コース8,500円(電話のみ) / しゃぶしゃぶコース4,800円(電話のみ) / もつ鍋コース3,300円(電話のみ)
■盛り合わせ: ジャック盛3,300円 / クイーン盛4,950円 / キング盛6,600円 / ジョーカー盛8,800円(電話のみ)
※コースは単品より量・質ともにお得。電話: 0565-21-0919

【店舗情報】営業11:30-14:00/17:00-22:00(L.O.21:30)、定休: 火曜・第二月曜、カード・電子マネー・PayPay可、全席禁煙(喫煙室あり)、お子様メニューあり

【ヒアリング順】1.人数 → 2.予算(一人あたり) → 3.好み(タン派/カルビ派/ハラミ派/さっぱり赤身派/ホルモン派) → 4.来店シーン → 5.苦手食材

【ルール】
- 親しみやすく丁寧に。絵文字を適度に使う
- 一度に1〜2項目ずつ質問する
- マークダウン記法(**や#など)は絶対に使わない。プレーンテキストのみ
- 提案時は部位の特徴や焼き方のコツを一言添える(例: 赤身はミディアムレアがおすすめ)
- 数量限定・品薄商品は「売り切れの場合があります」と添える
- 当日来店なら単品の組み合わせを、事前予約ならコースや盛り合わせも提案する
- 最終提案では品目リストと合計金額の目安を提示する`;

const QR_RULES = [
  { keys:["何名","人数"], opts:["1名","2名","3〜4名","5名以上"] },
  { keys:["予算","お一人","おひとり"], opts:["3,000円くらい","5,000円くらい","8,000円以上","奮発したい"] },
  { keys:["タン派","カルビ派","ハラミ派","赤身","ホルモン派","お好み","好み"], opts:["タン派","カルビ派","ハラミ派","さっぱり赤身派","ホルモン派"] },
  { keys:["シーン","目的","記念","お祝い","どのような","どんな"], opts:["記念日・お祝い","家族で","友人とわいわい","ひとりごほうび"] },
  { keys:["アレルギー","苦手"], opts:["特になし","ホルモン苦手","辛いもの苦手","海鮮苦手"] },
];

let API_KEY = localStorage.getItem("yakiniku_api_key") || "";
let hist = [];
let busy = false;

const chat = document.getElementById("chat");
const quick = document.getElementById("quick");
const txt = document.getElementById("txt");
const snd = document.getElementById("snd");
const setup = document.getElementById("setup");
const inputBar = document.getElementById("input-bar");

if (API_KEY) startChat();

document.getElementById("start-btn").onclick = () => {
  const k = document.getElementById("api-key-input").value.trim();
  if (!k.startsWith("sk-ant-")) { alert("正しいAPIキーを入力してください（sk-ant- で始まります）"); return; }
  API_KEY = k;
  localStorage.setItem("yakiniku_api_key", k);
  startChat();
};

function startChat() {
  setup.style.display = "none";
  chat.style.display = "flex";
  inputBar.style.display = "flex";
  addMsg(true, "いらっしゃいませ！🔥 本日は「豊南焼肉」へようこそ。\n\nAIソムリエが、お客様にぴったりのメニューをご提案します。\n\n今日は何名様でいらっしゃいますか？");
  showQuick(["1名","2名","3〜4名","5名以上"]);
}

function addMsg(ai, text) {
  const d = document.createElement("div");
  d.className = "msg " + (ai ? "ai" : "user");
  const av = document.createElement("div");
  av.className = "avatar";
  av.textContent = ai ? "🔥" : "👤";
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  d.appendChild(av); d.appendChild(b);
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

function showQuick(opts) {
  quick.innerHTML = "";
  opts.forEach(o => {
    const btn = document.createElement("button");
    btn.className = "qbtn";
    btn.textContent = o;
    btn.onclick = () => { quick.innerHTML = ""; send(o); };
    quick.appendChild(btn);
  });
}

function showTyping() {
  const d = document.createElement("div");
  d.className = "msg ai";
  d.id = "typing-row";
  d.innerHTML = '<div class="avatar">🔥</div><div class="typing"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>';
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function hideTyping() { var e = document.getElementById("typing-row"); if (e) e.remove(); }

async function send(text) {
  const t = (text || "").trim();
  if (!t || busy) return;
  txt.value = "";
  quick.innerHTML = "";
  busy = true;
  snd.disabled = true;

  hist.push({ role: "user", content: t });
  addMsg(false, t);
  showTyping();

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify({
        model: "claude-sonnet-4-5",
        max_tokens: 1000,
        system: SYSTEM_PROMPT,
        messages: hist
      })
    });

    const json = await res.json();
    hideTyping();

    if (!res.ok) {
      const em = (json && json.error && json.error.message) || "不明なエラー";
      if (res.status === 401) {
        addMsg(true, "⚠️ APIキーが無効です。ページを再読み込みして正しいキーを入力してください。");
        localStorage.removeItem("yakiniku_api_key");
      } else {
        addMsg(true, "⚠️ エラー(" + res.status + "): " + em);
      }
    } else {
      const reply = (json.content || []).map(b => b.text || "").join("").replace(/\*\*/g, "");
      hist.push({ role: "assistant", content: reply });
      addMsg(true, reply);

      let best = null, bestPos = -1;
      QR_RULES.forEach(r => {
        r.keys.forEach(k => {
          const p = reply.lastIndexOf(k);
          if (p > bestPos) { bestPos = p; best = r; }
        });
      });
      if (best) showQuick(best.opts);
    }
  } catch (e) {
    hideTyping();
    addMsg(true, "⚠️ 通信エラー: " + e.message);
  }
  busy = false;
  snd.disabled = false;
}

txt.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(txt.value); }
});
snd.addEventListener("click", () => send(txt.value));
</script>
</body>
</html>
